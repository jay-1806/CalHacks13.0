<!DOCTYPE html>
<html>
<head>
  <title>Sample Math Problem</title>
  <style>
    body { font-family: sans-serif; padding: 40px; line-height: 1.6; }
    .problem { border: 2px solid #ddd; padding: 20px; border-radius: 8px; max-width: 600px; margin: 40px auto; }
    .equation { font-size: 24px; font-weight: bold; text-align: center; margin: 20px 0; font-family: monospace; }
  </style>
</head>
<body>
  <div class="problem">
    <h2>Homework 4: Algebra</h2>
    <p>Solve the following equation for x. Be sure to show your work.</p>
    
    <div class="equation">
      2(x + 3) = 14
    </div>
    
    <p><strong>Step 1:</strong> Use the distributive property to expand the left side.</p>
    <p><strong>Step 2:</strong> Isolate the variable term.</p>
    <p><strong>Step 3:</strong> Solve for x.</p>
  </div>
</body>
</html>
